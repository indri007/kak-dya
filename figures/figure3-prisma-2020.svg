<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="786" viewBox="0 0 740 786" role="img" aria-labelledby="title desc">
<title id="title">PRISMA Flow Diagram</title>
<desc id="desc">PRISMA-style flow diagram generated by prisma-flow.</desc>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6"
          refX="7.5" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" />
  </marker>
</defs>
<style>
  svg { background: #ffffff; color: #111827; }
  .diagram-title {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-anchor: middle;
    fill: #111111;
  }
  .node rect {
    fill: #ffffff;
    stroke: #111111;
    stroke-width: 1.15;
    rx: 0;
    ry: 0;
  }
  .node.header.process-header rect {
    fill: #fbbf24;
    stroke: #b45309;
    stroke-width: 1.1;
    rx: 6;
    ry: 6;
  }
  .node.header.stage-label rect {
    fill: #9dc3e6;
    stroke: #1f4e79;
    stroke-width: 1.1;
    rx: 5;
    ry: 5;
  }
  .node.exclusion rect { fill: #ffffff; }
  .node text {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    fill: #111111;
  }
  .node.header.process-header text {
    font-size: 11px;
    font-weight: 700;
  }
  .node.header.stage-label text {
    font-size: 11px;
    font-weight: 700;
  }
  .node.note text {
    font-size: 10px;
  }
  .node.note.source text {
    font-size: 9.5px;
    font-style: italic;
  }
  .node.note.source-link text {
    fill: #1d4ed8;
    font-size: 10px;
    text-decoration: underline;
  }
  .edge {
    fill: none;
    stroke: #111111;
    stroke-width: 1.2;
    marker-end: url(#arrowhead);
  }
  marker polygon { fill: #111111; }
</style>
<text class="diagram-title" x="370" y="42">
  <tspan x="370" dy="0">PRISMA Flow Diagram</tspan>
</text>
<g class="edges">
<path id="identified_to_removed" class="edge" d="M 360 186 L 440 186" marker-end="url(#arrowhead)" />
<path id="identified_to_screened" class="edge" d="M 230 260 L 230 308" marker-end="url(#arrowhead)" />
<path id="screened_to_reports_sought" class="edge" d="M 230 382 L 230 414" marker-end="url(#arrowhead)" />
<path id="screened_to_records_excluded" class="edge" d="M 360 345 L 440 345" marker-end="url(#arrowhead)" />
<path id="reports_sought_to_reports_assessed" class="edge" d="M 230 488 L 230 520" marker-end="url(#arrowhead)" />
<path id="reports_sought_to_not_retrieved" class="edge" d="M 360 451 L 440 451" marker-end="url(#arrowhead)" />
<path id="reports_assessed_to_included" class="edge" d="M 230 594 L 230 678" marker-end="url(#arrowhead)" />
<path id="reports_assessed_to_reports_excluded" class="edge" d="M 360 557 L 440 557" marker-end="url(#arrowhead)" />
</g>
<g class="nodes">
<g id="databases_registers_header" class="node header process-header">
  <rect x="100" y="62" width="600" height="32" />
  <text x="400" y="78" text-anchor="middle">
    <tspan x="400" dy="0">Identification of new studies via databases and registers</tspan>
  </text>
</g>
<g id="identification_label" class="node header stage-label">
  <rect x="38" y="112" width="34" height="148" />
  <text x="55" y="186" text-anchor="middle" transform="rotate(-90 55 186)">Identification</text>
</g>
<g id="screening_label" class="node header stage-label">
  <rect x="38" y="308" width="34" height="328" />
  <text x="55" y="472" text-anchor="middle" transform="rotate(-90 55 472)">Screening</text>
</g>
<g id="included_label" class="node header stage-label">
  <rect x="38" y="678" width="34" height="86" />
  <text x="55" y="721" text-anchor="middle" transform="rotate(-90 55 721)">Included</text>
</g>
<g id="identified" class="node stage">
  <rect x="100" y="112" width="260" height="148" />
  <text x="114" y="158" text-anchor="start">
    <tspan x="114" dy="0">Records identified from:</tspan>
    <tspan x="114" dy="14">Databases (n = 251)</tspan>
    <tspan x="114" dy="14">Scopus (n=120), WoS (n=80), IEEE</tspan>
    <tspan x="114" dy="14">(n=51)</tspan>
    <tspan x="114" dy="14">Registers (n = 0)</tspan>
  </text>
</g>
<g id="removed" class="node stage">
  <rect x="440" y="112" width="260" height="148" />
  <text x="454" y="151" text-anchor="start">
    <tspan x="454" dy="0">Records removed before screening:</tspan>
    <tspan x="454" dy="14">Duplicate records (n = 56)</tspan>
    <tspan x="454" dy="14">Records marked as ineligible by</tspan>
    <tspan x="454" dy="14">automation tools (n = 0)</tspan>
    <tspan x="454" dy="14">Records removed for other reasons</tspan>
    <tspan x="454" dy="14">(n = 0)</tspan>
  </text>
</g>
<g id="screened" class="node stage">
  <rect x="100" y="308" width="260" height="74" />
  <text x="114" y="338" text-anchor="start">
    <tspan x="114" dy="0">Records screened</tspan>
    <tspan x="114" dy="14">(n = 195)</tspan>
  </text>
</g>
<g id="records_excluded" class="node exclusion">
  <rect x="440" y="308" width="260" height="74" />
  <text x="454" y="338" text-anchor="start">
    <tspan x="454" dy="0">Records excluded</tspan>
    <tspan x="454" dy="14">(n = 140)</tspan>
  </text>
</g>
<g id="reports_sought" class="node stage">
  <rect x="100" y="414" width="260" height="74" />
  <text x="114" y="444" text-anchor="start">
    <tspan x="114" dy="0">Reports sought for retrieval</tspan>
    <tspan x="114" dy="14">(n = 55)</tspan>
  </text>
</g>
<g id="reports_not_retrieved" class="node exclusion">
  <rect x="440" y="414" width="260" height="74" />
  <text x="454" y="444" text-anchor="start">
    <tspan x="454" dy="0">Reports not retrieved</tspan>
    <tspan x="454" dy="14">(n = 0)</tspan>
  </text>
</g>
<g id="reports_assessed" class="node stage">
  <rect x="100" y="520" width="260" height="74" />
  <text x="114" y="550" text-anchor="start">
    <tspan x="114" dy="0">Reports assessed for eligibility</tspan>
    <tspan x="114" dy="14">(n = 55)</tspan>
  </text>
</g>
<g id="reports_excluded" class="node exclusion">
  <rect x="440" y="514" width="260" height="122" />
  <text x="454" y="547" text-anchor="start">
    <tspan x="454" dy="0">Reports excluded:</tspan>
    <tspan x="454" dy="14">Tidak memenuhi kriteria inklusi (n =</tspan>
    <tspan x="454" dy="14">15)</tspan>
    <tspan x="454" dy="14">Bukan penelitian primer (n = 5)</tspan>
    <tspan x="454" dy="14">Teks lengkap tidak tersedia (n = 5)</tspan>
  </text>
</g>
<g id="included" class="node stage">
  <rect x="100" y="678" width="260" height="86" />
  <text x="114" y="714" text-anchor="start">
    <tspan x="114" dy="0">New studies included in review</tspan>
    <tspan x="114" dy="14">(n = 30)</tspan>
  </text>
</g>
</g>
</svg>
